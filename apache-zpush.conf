Alias /Microsoft-Server-ActiveSync /usr/share/zpush/index.php
Alias /AutoDiscover/AutoDiscover.xml /usr/share/zpush/autodiscover/autodiscover.php
Alias /Autodiscover/Autodiscover.xml /usr/share/zpush/autodiscover/autodiscover.php
Alias /autodiscover/autodiscover.xml /usr/share/zpush/autodiscover/autodiscover.php
<Directory /usr/share/zpush>
    DirectoryIndex index.php
    Options -Indexes +FollowSymLinks
    AllowOverride none
    Require all granted
    <Files "config.php">
      Require all denied
    </Files>
</Directory>
Alias /gmail-pubsub /usr/share/zpush/backend/gmail/pubsub_receiver.php
<Directory /usr/share/zpush/backend/gmail>
    Require all granted
    <Files "config.php">
      Require all denied
    </Files>
</Directory>
